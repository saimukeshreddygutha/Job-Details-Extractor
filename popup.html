<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --green: #00f0a0;
        --green-dark: #00c98d;
        --ink: #001b12;
      }
      * { box-sizing: border-box; }
      body {
        width: 260px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        color: #111;
      }
      .title {
        font-size: 13px;
        font-weight: 700;
        margin: 0 0 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 18px; height: 18px; border-radius: 50%;
        background: var(--green); flex: 0 0 auto;
      }
      .count-card {
        background: #f5f6f7;
        border-radius: 12px;
        padding: 14px;
        text-align: center;
        margin-bottom: 12px;
      }
      .count-num { font-size: 30px; font-weight: 800; line-height: 1; }
      .count-label { font-size: 12px; color: #666; margin-top: 4px; }
      button {
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      .primary { background: var(--green); color: var(--ink); }
      .primary:hover { background: var(--green-dark); }
    </style>
  </head>
  <body>
    <p class="title"><span class="dot"></span> Job Details Extractor</p>
    <div class="count-card">
      <div class="count-num" id="count">0</div>
      <div class="count-label">jobs tracked</div>
    </div>
    <button class="primary" id="open-dashboard">Open Dashboard</button>
    <script src="popup.js"></script>
  </body>
</html>
